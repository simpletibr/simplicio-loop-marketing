# Simplicio internal-format inventory for simplicio-loop-marketing.
version = 1
policy = "simplicio-binary-internal-formats/v1"
mode = "enforced"
owner = "wesleysimplicio"

[[paths]]
pattern = "package.json"
category = "toolchain_mandated"
owner = "wesleysimplicio"
target_format = "package-manager metadata"
reason = "Required by Node/npm; never an application data or IPC format"
review = "2027-01-31"

[[paths]]
pattern = ".starter-meta.toml"
category = "human_edited_configuration"
owner = "wesleysimplicio"
target_format = "TOML"
reason = "Mapper bootstrap configuration migrated from .starter-meta.json"
review = "2027-01-31"

[[paths]]
pattern = "contracts/**"
scope = "directory"
category = "historical_documentation"
owner = "wesleysimplicio"
target_format = "Versioned binary contract with external compatibility fixture"
reason = "Checked-in contract fixtures are not runtime source of truth"
review = "2027-01-31"

[[paths]]
pattern = "data/**"
scope = "directory"
category = "internal_persistence"
owner = "wesleysimplicio"
target_format = "HBP for append-only runs/evidence; HBI for indexes"
reason = "Generated campaign and provider state"
review = "2027-01-31"

[[paths]]
pattern = ".marketing-engine/**"
scope = "directory"
category = "internal_persistence"
owner = "wesleysimplicio"
target_format = "HBP for receipts; HBI for indexed artifacts"
reason = "Host-project runtime state"
review = "2027-01-31"

[[paths]]
pattern = "lib/data/manifest.ts"
category = "internal_index"
owner = "wesleysimplicio"
target_format = "HBI v1 envelope"
reason = "Producer writeManifest and consumers evidence/publish use an atomic typed index"
review = "2027-01-31"

[[paths]]
pattern = "lib/data/runs.ts"
category = "internal_persistence"
owner = "wesleysimplicio"
target_format = "HBP v1 envelope stream"
reason = "appendRunLog produces and status/evidence consume the append-only run ledger"
review = "2027-01-31"

[[paths]]
pattern = "lib/loop/journal.ts"
category = "internal_persistence"
owner = "wesleysimplicio"
target_format = "HBP v1 envelope stream"
reason = "recordAttempt produces and loop verdict/retrospective consume durable attempt state"
review = "2027-01-31"

[[paths]]
pattern = "lib/gate/evidence.ts"
category = "source_format_boundary"
owner = "wesleysimplicio"
target_format = "Typed evidence artifacts at external file boundary"
reason = "Evidence gate reads external compliance, QA and browser outputs while the manifest source is HBI"
review = "2027-01-31"

[[paths]]
pattern = ".simplicio/ledger/savings-events.jsonl"
category = "third_party_protocol_boundary"
owner = "wesleysimplicio"
target_format = "Simplicio CLI-owned savings-event/v1 JSONL"
reason = "The upstream simplicio-cli runtime owns this compatibility ledger; marketing never appends to it"
review = "2027-01-31"

[[paths]]
pattern = ".simplicio/update/first-party-adapters.json"
category = "toolchain_mandated"
owner = "wesleysimplicio"
target_format = "Simplicio runtime update metadata"
reason = "Upstream runtime metadata is not marketing application state"
review = "2027-01-31"

[[paths]]
pattern = "lib/providers/**"
scope = "directory"
category = "third_party_protocol_boundary"
owner = "wesleysimplicio"
target_format = "Typed provider adapter"
reason = "Provider APIs may mandate JSON; raw payload ends at adapter"
review = "2027-01-31"

[[paths]]
pattern = "e2e/**"
scope = "directory"
category = "third_party_protocol_boundary"
owner = "wesleysimplicio"
target_format = "Typed test fixture/adapter"
reason = "Tests exercise externally mandated provider responses"
review = "2027-01-31"

[[paths]]
pattern = "scripts/lint.js"
category = "policy_scanner"
owner = "wesleysimplicio"
target_format = "Markdown output plus HBP evidence"
reason = "Scanner source contains JSON validation patterns"
review = "2027-01-31"

[[paths]]
pattern = "scripts/check-internal-formats.mjs"
category = "policy_scanner"
owner = "wesleysimplicio"
target_format = "Markdown output plus HBP evidence"
reason = "Scanner source is excluded from its own source scan"
review = "2027-01-31"

[[paths]]
pattern = ".claude/**"
scope = "directory"
category = "toolchain_mandated"
owner = "wesleysimplicio"
target_format = "Tool configuration"
reason = "Host tooling metadata; not application state"
review = "2027-01-31"

[[paths]]
pattern = ".simplicio-loop/install-ownership.json"
category = "toolchain_mandated"
owner = "wesleysimplicio"
target_format = "simplicio.loop-install-ownership/v1 (written by `simplicio-loop install`)"
reason = "Ownership receipt emitted by the official Loop installer; marketing never writes it"
review = "2027-01-31"

[[paths]]
pattern = ".codex/**"
scope = "directory"
category = "toolchain_mandated"
owner = "wesleysimplicio"
target_format = "Tool configuration"
reason = "Host tooling metadata; not application state"
review = "2027-01-31"

[[paths]]
pattern = ".ralph/**"
scope = "directory"
category = "toolchain_mandated"
owner = "wesleysimplicio"
target_format = "Shell orchestration with typed boundary payloads"
reason = "Loop operator scripts are control-plane tooling, not application state"
review = "2027-01-31"

[[paths]]
pattern = ".simplicio/**"
scope = "directory"
category = "internal_cache"
owner = "wesleysimplicio"
target_format = "HBP/HBI runtime envelopes"
reason = "Simplicio runtime metadata and ledgers are internal projections"
review = "2027-01-31"

[[paths]]
pattern = ".specs/**"
scope = "directory"
category = "historical_documentation"
owner = "wesleysimplicio"
target_format = "Versioned specification fixture"
reason = "Specifications and compatibility fixtures are not runtime state"
review = "2027-01-31"

[[paths]]
pattern = "bin/**"
scope = "directory"
category = "source_format_boundary"
owner = "wesleysimplicio"
target_format = "Typed CLI boundary"
reason = "CLI JSON is an external display/configuration boundary"
review = "2027-01-31"

[[paths]]
pattern = "docs/**"
scope = "directory"
category = "historical_documentation"
owner = "wesleysimplicio"
target_format = "Documentation/evidence fixture"
reason = "Documentation artifacts do not act as runtime state"
review = "2027-01-31"

[[paths]]
pattern = "extension/**"
scope = "directory"
category = "source_format_boundary"
owner = "wesleysimplicio"
target_format = "Versioned extension contract"
reason = "Extension manifests and schemas are public contract inputs"
review = "2027-01-31"

[[paths]]
pattern = "extensions/**"
scope = "directory"
category = "source_format_boundary"
owner = "wesleysimplicio"
target_format = "Versioned extension contract"
reason = "Extension manifests and lock files are public contract inputs"
review = "2027-01-31"

[[paths]]
pattern = "hooks/**"
scope = "directory"
category = "toolchain_mandated"
owner = "wesleysimplicio"
target_format = "Hook protocol payload"
reason = "Hook payloads are dictated by the host automation protocol"
review = "2027-01-31"

[[paths]]
pattern = "lib/**"
scope = "directory"
category = "source_format_boundary"
owner = "wesleysimplicio"
target_format = "Typed in-memory structures at external protocol edges"
reason = "JSON use is bounded to adapter, CLI, fixture, or protocol edges; internal state has exact migration entries"
review = "2027-01-31"

[[paths]]
pattern = "outputs/**"
scope = "directory"
category = "internal_cache"
owner = "wesleysimplicio"
target_format = "Ephemeral dry-run output"
reason = "Generated outputs are disposable cache-like artifacts, never the source of truth"
review = "2027-01-31"

[[paths]]
pattern = "scripts/**"
scope = "directory"
category = "toolchain_mandated"
owner = "wesleysimplicio"
target_format = "Build/test tooling boundary"
reason = "Scripts consume JSON from external tools or emit reports"
review = "2027-01-31"

[[paths]]
pattern = "tests/**"
scope = "directory"
category = "test_fixture"
owner = "wesleysimplicio"
target_format = "Test fixture or assertion payload"
reason = "Tests model public contracts and external protocol fixtures"
review = "2027-01-31"

[[paths]]
pattern = "tools/**"
scope = "directory"
category = "toolchain_mandated"
owner = "wesleysimplicio"
target_format = "Policy tooling boundary"
reason = "Standalone policy tooling consumes and emits scanner payloads"
review = "2027-01-31"

[[paths]]
pattern = "video/**"
scope = "directory"
category = "third_party_protocol_boundary"
owner = "wesleysimplicio"
target_format = "Remotion/toolchain configuration"
reason = "Video rendering tooling owns its provider/configuration protocol"
review = "2027-01-31"

[[paths]]
pattern = "package-lock.json"
category = "toolchain_mandated"
owner = "wesleysimplicio"
target_format = "Package-manager metadata"
reason = "Required by npm; never application state"
review = "2027-01-31"

[[paths]]
pattern = "stryker.config.json"
category = "toolchain_mandated"
owner = "wesleysimplicio"
target_format = "Mutation-testing configuration"
reason = "Tool configuration is not runtime state"
review = "2027-01-31"

[[paths]]
pattern = "tsconfig.json"
category = "toolchain_mandated"
owner = "wesleysimplicio"
target_format = "TypeScript configuration"
reason = "Required by the TypeScript toolchain; never application state"
review = "2027-01-31"
